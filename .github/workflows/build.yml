name: Build

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

env:
  JDK_REPO: https://github.com/microsoft/openjdk-jdk25u.git

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      branch: ${{ steps.latest.outputs.branch }}
      version: ${{ steps.latest.outputs.version }}
      build: ${{ steps.latest.outputs.build }}
    steps:
      - name: Find latest Microsoft OpenJDK release branch
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Zero-pad the version and build number so a plain sort orders release/jdk-<version>_<build> numerically
          branch=$(git ls-remote --heads "$JDK_REPO" \
            | grep -Eo 'release/jdk-[0-9.]+_[0-9]+$' \
            | awk -F'[-_]' '{ split($2, v, "."); printf "%05d%05d%05d%05d%05d%05d %s\n", v[1], v[2], v[3], v[4], v[5], $3, $0 }' \
            | sort | tail -n 1 | cut -d' ' -f2)
          version=${branch#release/jdk-}
          version=${version/_/+}
          echo "Latest is $branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Scheduled runs skip versions that already have an installer artifact (the last upload of a successful build)
          built=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=jdk-${version/+/%2B}-macos-x64-installer" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$built" -gt 0 ]; then
            echo "Already built, skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    # Mojave only runs on Intel Macs, so build natively for x86_64
    runs-on: macos-15-intel
    env:
      JDK_BRANCH: ${{ needs.check.outputs.branch }}
      JDK_VERSION: ${{ needs.check.outputs.version }}
      MACOSX_MIN: '10.14'
      BUILD_DIR: jdk/build/macosx-x86_64-server-release
      INSTALL_DIR: /Library/Java/JavaVirtualMachines/openjdk-mojave-25.jdk
    steps:
      - uses: actions/checkout@v7

      - name: Fetch OpenJDK
        run: git clone --depth 1 --branch "$JDK_BRANCH" "$JDK_REPO" jdk

      - name: Apply patches
        run: git -C jdk apply --verbose "$PWD"/patches/*.patch

      - name: Install autoconf
        run: brew install autoconf

      - name: Import Apple Developer certificates
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 21600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          app_id=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          installer_id=$(security find-identity -v build.keychain | awk -F'"' '/Developer ID Installer/ {print $2; exit}')
          if [ -z "$app_id" ] || [ -z "$installer_id" ]; then
            echo "::error::APPLE_CERTIFICATE needs both a Developer ID Application and a Developer ID Installer certificate"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$app_id" >> "$GITHUB_ENV"
          echo "APPLE_INSTALLER_IDENTITY=$installer_id" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: jdk
        run: >
          bash configure
          --with-boot-jdk="$JAVA_HOME_25_X64"
          --with-xcode-path=/Applications/Xcode_16.4.app
          --with-version-build="${JDK_VERSION##*+}"
          --with-version-pre="$(sed -n 's/^DEFAULT_PROMOTED_VERSION_PRE=//p' make/conf/version-numbers.conf)"
          --without-version-opt
          --with-macosx-codesign=hardened
          --with-macosx-codesign-identity="$APPLE_SIGNING_IDENTITY"

      - name: Build
        working-directory: jdk
        run: make product-bundles

      - name: Verify minimum macOS version
        run: |
          find "$BUILD_DIR/images/jdk" -type f | while read -r f; do
            if file -b "$f" | grep -q Mach-O; then
              echo "$(otool -l "$f" | awk '$1 == "minos" { print $2; exit }') $f"
            fi
          done | tee "$RUNNER_TEMP/minos.txt"
          grep -q 'libawt_lwawt.dylib$' "$RUNNER_TEMP/minos.txt"
          if grep -v "^$MACOSX_MIN " "$RUNNER_TEMP/minos.txt"; then
            echo "::error::Binaries above with a minimum macOS version other than $MACOSX_MIN"
            exit 1
          fi

      - name: Build installer
        run: |
          mkdir "$RUNNER_TEMP/pkgroot"
          ditto "$BUILD_DIR"/images/jdk-bundle/*.jdk "$RUNNER_TEMP/pkgroot/$(basename "$INSTALL_DIR")"
          codesign --force --timestamp --options runtime -s "$APPLE_SIGNING_IDENTITY" \
            "$RUNNER_TEMP/pkgroot/$(basename "$INSTALL_DIR")"
          # The bundle ID is shared with other OpenJDK builds; don't let Installer redirect
          # the install to (or skip it because of) one of them found elsewhere on disk
          pkgbuild --analyze --root "$RUNNER_TEMP/pkgroot" "$RUNNER_TEMP/component.plist"
          plutil -replace 0.BundleIsRelocatable -bool false "$RUNNER_TEMP/component.plist"
          plutil -replace 0.BundleIsVersionChecked -bool false "$RUNNER_TEMP/component.plist"
          plutil -p "$RUNNER_TEMP/component.plist"
          mkdir "$RUNNER_TEMP/installer"
          pkgbuild --root "$RUNNER_TEMP/pkgroot" --component-plist "$RUNNER_TEMP/component.plist" \
            --install-location "$(dirname "$INSTALL_DIR")" \
            --identifier org.polyfrost.openjdk-mojave-25 --version "$JDK_VERSION" \
            --sign "$APPLE_INSTALLER_IDENTITY" --timestamp \
            "$RUNNER_TEMP/installer/openjdk-mojave-$JDK_VERSION.pkg"

      - name: Notarize installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pkg=$(echo "$RUNNER_TEMP"/installer/*.pkg)
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          xcrun notarytool submit "$pkg" "${auth[@]}" --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
          if ! grep -q '"status":"Accepted"' "$RUNNER_TEMP/notary.json"; then
            xcrun notarytool log "$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/notary.json")" "${auth[@]}"
            exit 1
          fi
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"

      - name: Install
        run: |
          spctl --assess --type install -vv "$RUNNER_TEMP"/installer/*.pkg
          sudo installer -pkg "$RUNNER_TEMP"/installer/*.pkg -target /
          codesign --verify --deep --strict -vv "$INSTALL_DIR"
          /usr/libexec/java_home -V

      - name: Smoke test
        run: |
          echo 'void main() { IO.println(java.awt.Toolkit.getDefaultToolkit().getScreenSize()); }' > "$RUNNER_TEMP/Smoke.java"
          "$INSTALL_DIR/Contents/Home/bin/java" -version
          "$INSTALL_DIR/Contents/Home/bin/java" "$RUNNER_TEMP/Smoke.java"

      - uses: actions/upload-artifact@v7
        with:
          name: jdk-${{ env.JDK_VERSION }}-macos-x64
          path: ${{ env.BUILD_DIR }}/bundles/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: jdk-${{ env.JDK_VERSION }}-macos-x64-installer
          path: ${{ runner.temp }}/installer/*.pkg
